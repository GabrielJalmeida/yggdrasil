[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yggdrasil-api"
version = "0.7.0"
description = "Read-only, evidence-backed static repository mapper"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.38,<1.0",
  "pydantic>=2.12,<3.0",
  "SQLAlchemy>=2.0.55,<2.2",
  "alembic>=1.18,<2.0",
  "httpx>=0.28,<1.0",
  "python-dotenv>=1.0,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
  "ruff>=0.14,<1.0",
  "coverage>=7.10,<8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]
